name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  preflight:
    name: Validate release ref
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    outputs:
      default_branch: ${{ steps.ref.outputs.default_branch }}
    steps:
      - name: Require the default branch
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" ]]; then
            echo "Release dispatch rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            docker_platform: ''
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            docker_platform: linux/amd64
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            docker_platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Test
        run: cargo test --locked -p stuff -p mynpm -p mypypi -p myoci
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: matrix.docker_platform != ''
      - name: Build Linux release image
        if: matrix.docker_platform != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/musl
          file: docker/musl/Dockerfile
          platforms: ${{ matrix.docker_platform }}
          load: true
          tags: stuff-builder:${{ matrix.target }}
          cache-from: type=gha,scope=stuff-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=stuff-${{ matrix.target }}
      - name: Build macOS release
        if: matrix.docker_platform == ''
        run: make release TARGET="${{ matrix.target }}"
      - name: Build Linux release
        if: matrix.docker_platform != ''
        run: |
          docker run --rm --init \
            --platform "${{ matrix.docker_platform }}" \
            -e CI \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            stuff-builder:${{ matrix.target }} \
            sh -ec 'make release TARGET=${{ matrix.target }} && verify-static-elf target/${{ matrix.target }}/dist/stuff'
      - name: Verify release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/dist/stuff"
          "$binary" --help >/dev/null
          if [[ "$TARGET" == *linux-musl ]]; then
            file "$binary" | grep -Eq 'statically linked|static-pie linked'
            ! readelf -lW "$binary" | grep -q INTERP
          fi
      - name: Package release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/dist/stuff" "dist/stuff-$TARGET"
          cp LICENSE NOTICE dist/
          chmod +x "dist/stuff-$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stuff-${{ matrix.target }}
          path: |
            dist/stuff-${{ matrix.target }}
            dist/LICENSE
            dist/NOTICE

  release:
    name: Create pre-release
    needs: [preflight, build]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Recheck release ref and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ needs.preflight.outputs.default_branch }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" || "$DEFAULT_BRANCH" != "$default_branch" ]]; then
            echo "Release publication rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>&1); then
            echo "Release publication rejected: tag $RELEASE_TAG already exists; inspect it before proceeding" >&2
            exit 1
          else
            if [[ "$response" != *"HTTP 404"* ]]; then
              printf 'Could not verify that tag %s is absent: %s\n' "$RELEASE_TAG" "$response" >&2
              exit 1
            fi
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stuff-*
          path: dist
      - name: Validate and package release artifacts
        run: |
          expected=$'stuff-aarch64-apple-darwin\nstuff-aarch64-unknown-linux-musl\nstuff-x86_64-unknown-linux-musl'
          mkdir release
          find dist -name 'stuff-*' -type f -exec cp {} release/ \;
          actual=$(find release -maxdepth 1 -name 'stuff-*' -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected release artifacts:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          (cd release && sha256sum stuff-* | LC_ALL=C sort -k2 > SHA256SUMS)
          (cd release && sha256sum -c SHA256SUMS)
          cp dist/stuff-aarch64-apple-darwin/LICENSE dist/stuff-aarch64-apple-darwin/NOTICE release/
      - name: Create release tag at triggering SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: release-${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ needs.preflight.outputs.default_branch }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" || "$DEFAULT_BRANCH" != "$default_branch" ]]; then
            echo "Release publication rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>&1); then
            echo "Release publication rejected: tag $RELEASE_TAG already exists; inspect it before proceeding" >&2
            exit 1
          elif [[ "$response" != *"HTTP 404"* ]]; then
            printf 'Could not verify that tag %s is absent: %s\n' "$RELEASE_TAG" "$response" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" 2>&1); then
            echo "Created $RELEASE_TAG at $GITHUB_SHA"
          else
            printf 'Could not create release tag %s at %s: %s\n' "$RELEASE_TAG" "$GITHUB_SHA" "$response" >&2
            exit 1
          fi
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: gh release create "$RELEASE_TAG" release/stuff-* release/SHA256SUMS release/LICENSE release/NOTICE --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag --title "$RELEASE_TAG"
