name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup rust
        run: rustup show
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked

  ecosystem-smoke:
    strategy:
      fail-fast: false
      matrix:
        # x86_64 Linux, ARM64 Linux, and ARM64 macOS: each runner builds,
        # validates, and installs the host platform's wheels. The dedicated
        # mypypi-linux-native job covers the manylinux 2.28 baseline.
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup rust
        run: rustup show
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - name: pin npm
        run: npm install -g npm@12.2.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.15.0
          run_install: false
      - name: read the uv pin
        run: echo "UV_VERSION=$(cat deploy/uv-version)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.15
      - name: select the pinned interpreter
        run: echo "PYTHON=$(uv python find 3.15)" >> "$GITHUB_ENV"
      - name: install native wheel repair tooling
        if: runner.os == 'macOS'
        run: deploy/provision-mypypi-repair.sh
      - name: registry flows with real package managers
        run: deploy/ecosystem-smoke.sh

  mypypi-linux-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build and publish native wheels on the manylinux 2.28 baseline
        run: make test-mypypi-linux-native

  pipeline-independence:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup rust
        run: rustup show
      - name: read the uv pin
        run: echo "UV_VERSION=$(cat deploy/uv-version)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.15
      - name: select the pinned interpreter
        run: echo "PYTHON=$(uv python find 3.15)" >> "$GITHUB_ENV"
      - name: single-registry publishes leave other generations untouched
        run: deploy/check-pipeline-independence.sh

  worker-runtime:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup rust
        run: rustup show
      - run: rustup target add wasm32-unknown-unknown
      - name: install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: install binaryen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: crates/stuff-worker/pnpm-lock.yaml
      - name: install worker dependencies
        run: pnpm install --frozen-lockfile
        working-directory: crates/stuff-worker
      - name: build the actual worker bundle
        run: pnpm run build
        working-directory: crates/stuff-worker
      - name: exercise the worker runtime
        run: pnpm run test:runtime
        working-directory: crates/stuff-worker
