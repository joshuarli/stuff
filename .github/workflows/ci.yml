name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: setup rust
        run: rustup show
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked

  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/mynpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.0
          package-manager-cache: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          version: 12.15.0
          install: false
      - name: Install locked dependencies
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
        run: pnpm install --frozen-lockfile --ignore-scripts --store-dir ../../.work/pnpm-store
      - name: check
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
          npm_config_cache: ${{ github.workspace }}/.work/tmp/npm-cache
        run: pnpm check

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    defaults:
      run:
        working-directory: tools/mypypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: 0.13.5
      - run: uv python install 3.15
      - run: uv sync --locked --python 3.15
      - run: uv run --locked --python 3.15 pytest -q -m "not network" tests
      - run: uv run --locked --python 3.15 pytest -q -m network tests/integration/test_uv_resolution.py
