name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: setup rust
        run: rustup show
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked

  ecosystem-smoke:
    strategy:
      fail-fast: false
      matrix:
        # x86_64 Linux, ARM64 Linux, and ARM64 macOS: each runner builds,
        # validates, and installs the host platform's wheels. The dedicated
        # mypypi-linux-native job covers the manylinux 2.28 baseline.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: setup rust
        run: rustup show
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - name: pin npm
        run: npm install -g npm@12.2.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.15.0
          run_install: false
      - name: read the uv pin
        run: echo "UV_VERSION=$(cat deploy/uv-version)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.15
      - name: select the pinned interpreter
        run: echo "PYTHON=$(uv python find 3.15)" >> "$GITHUB_ENV"
      - name: install native wheel repair tooling
        if: runner.os == 'macOS'
        run: deploy/provision-mypypi-repair.sh
      - name: registry flows with real package managers
        run: deploy/ecosystem-smoke.sh

  mypypi-linux-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: build and publish native wheels on the manylinux 2.28 baseline
        run: make test-mypypi-linux-native

  pipeline-independence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: setup rust
        run: rustup show
      - name: read the uv pin
        run: echo "UV_VERSION=$(cat deploy/uv-version)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.15
      - name: select the pinned interpreter
        run: echo "PYTHON=$(uv python find 3.15)" >> "$GITHUB_ENV"
      - name: single-registry publishes leave other generations untouched
        run: deploy/check-pipeline-independence.sh

  worker-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: setup rust
        run: rustup show
      - run: rustup target add wasm32-unknown-unknown
      - name: install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: install binaryen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: crates/stuff-worker/package-lock.json
      - name: install worker dependencies
        run: npm ci
        working-directory: crates/stuff-worker
      - name: build the actual worker bundle
        run: npm run build
        working-directory: crates/stuff-worker
      - name: exercise the worker runtime
        run: npm run test:runtime
        working-directory: crates/stuff-worker
