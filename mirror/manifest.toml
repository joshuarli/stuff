# Static artifact mirror. Each entry pins one upstream artifact by URL and
# upstream SHA-256; `stuff publish mirror` re-hosts the kept files as
# <id>.zip under an immutable generation (see docs/PUBLISHING.md).
#
# Only artifacts the ~/usr installer downloads are mirrored; GitHub-hosted
# artifacts are excluded for now.

schema_version = 1

