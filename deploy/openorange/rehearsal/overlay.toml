# Rehearsal overlay, installed as /etc/openorange/overlay.toml on lisa only
# while rehearsing. A throwaway demo Worker answers for stats.17166969.xyz (so
# the proof can use `curl --resolve stats.17166969.xyz:443:100.68.104.43`)
# in its own namespace/pool/bucket; the real Stats app is disabled meanwhile.
# Remove the file (and run `oo render`) to return to apps.toml as shipped.
[apps.stats]
enabled = false

[apps.demo]
kind = "orange"
display = "Rehearsal demo"
namespace = "demo"
ip = "172.29.80.30"
port = 8080
hostnames = ["stats.17166969.xyz", "demo.17166969.xyz"]
public_hostnames = ["demo.17166969.xyz"]
buckets = ["demo-data"]
image = "oo-demo"
memory = "512m"
cpus = 1.0
