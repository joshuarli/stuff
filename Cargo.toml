[profile.dev.package.mycrates]
opt-level = 2

[profile.dev.package.mynpm]
opt-level = 2

[profile.dev.package.mypypi]
opt-level = 2

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.stuff-catalog]
opt-level = 2

[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[workspace]
resolver = "2"
exclude = [".work"]
members = [
  "crates/h12tiny-client-normalize",
  "crates/h12tiny-tls-system",
  "crates/h12tiny-client-sync",
  "crates/mycrates",
  "crates/mynpm",
  "crates/mypypi",
  "crates/stuff-store",
  "crates/stuff-cargo-shard",
  "crates/stuff-http",
  "crates/stuff-server",
  "crates/stuff-worker",
  "crates/stuff-catalog",
  "crates/stuff",
]
