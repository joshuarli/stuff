[package]
name = "h12tiny-client-sync"
version = "0.6.0"
edition = "2021"
rust-version = "1.89"
description = "Blocking direct-origin HTTP/1.1 client for h12tiny"
license = "MIT"

repository = "https://github.com/laputa-systems/h12tiny"
[features]
default = []
tls = ["dep:rustls", "dep:rustls-graviola", "dep:rustls-webpki", "dep:h12tiny-tls-system"]

[dependencies]
h12tiny-client-normalize = { version = "0.6.0", path = "../h12tiny-client-normalize" }
http = "1.5.0"
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"], optional = true }
rustls-graviola = { version = "0.4.0", default-features = false, optional = true }
rustls-webpki = { version = "0.103.16", default-features = false, optional = true }
h12tiny-tls-system = { version = "0.6.0", path = "../h12tiny-tls-system", optional = true }
