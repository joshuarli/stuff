[package]
name = "h12tiny-tls-system"
version = "0.6.0"
edition = "2021"
rust-version = "1.89"
description = "Operating-system TLS trust for h12tiny clients"
license = "MIT"

repository = "https://github.com/laputa-systems/h12tiny"

[dependencies]
base64 = "0.23"
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-webpki = { version = "0.103.16", default-features = false }
rustls-native-certs = "0.8.5"
openssl-probe = "0.2"

[target.'cfg(target_vendor = "apple")'.dependencies]
rustls-platform-verifier = "0.7.1"
