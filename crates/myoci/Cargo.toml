[package]
name = "myoci"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "OCI registry import, publish, and serve tooling"
repository = "https://github.com/joshuarli/stuff"
autobins = false

[lib]
name = "myoci"
path = "src/lib.rs"

[[bin]]
name = "myoci"
path = "src/main.rs"

[dependencies]
deser-json = "0.10"
deser-value = "0.10"
httparse = "1"
stuff-catalog = { version = "0.1.0", path = "../stuff-catalog" }
stuff-oci = { version = "0.1.0", path = "../stuff-oci" }
stuff-store = { version = "0.1.0", path = "../stuff-store" }

[dev-dependencies]
tempfile = "3.13"
