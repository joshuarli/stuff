[package]
name = "myoci"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "OCI registry import, publish, and serve tooling"
repository = "https://github.com/joshuarli/stuff"
autobins = false

[lib]
name = "myoci"
path = "src/lib.rs"

[[bin]]
name = "myoci"
path = "src/main.rs"

[dependencies]
deser-json = "0.10"
deser-value = "0.10"
h12tiny-client-sync = { version = "0.6.0", path = "../h12tiny-client-sync", features = ["tls"] }
httparse = "1"
rustc-hash = "2.1.3"
stuff-catalog = { version = "0.1.0", path = "../stuff-catalog" }
stuff-oci = { version = "0.1.0", path = "../stuff-oci" }
stuff-store = { version = "0.1.0", path = "../stuff-store" }
stuff-url = { version = "0.1.0", path = "../stuff-url" }
toml_edit = { version = "0.25.19", default-features = false, features = ["parse"] }

[dev-dependencies]
ctrlc = "3.5.2"
tempfile = "3.13"
