[package]
name = "mypypi"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Python wheel index"
repository = "https://github.com/joshuarli/stuff"
autobins = false

[lib]
name = "mypypi"
path = "src/lib.rs"

[[bin]]
name = "mypypi"
path = "src/main.rs"

[dependencies]
deser-toml = "0.10"
deser-value = "0.10"
flate2 = { version = "1.0", features = ["miniz_oxide"] }
h12tiny-client-sync = { version = "0.6.0", path = "../h12tiny-client-sync", features = ["tls"] }
pep440_rs = "0.7"
rawzip = "0.5.2"
rustc-hash = "2.1.3"
sha2 = "0.11"
stuff-store = { version = "0.1.0", path = "../stuff-store" }
stuff-catalog = { version = "0.1.0", path = "../stuff-catalog" }
tar = "0.4"
stuff-url = { version = "0.1.0", path = "../stuff-url" }

[dev-dependencies]
deser-json = "0.10"
tempfile = "3.13"
