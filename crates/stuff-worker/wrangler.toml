# stuff worker deployment (Cloudflare).
# Owner flow: cf deploy (builds wasm via npm run build:wasm, provisions R2 with
# --provision on first deploy). Do not edit cloudflare.config.ts or
# wrangler.config.ts by hand; delete both and re-run cf migrate, which refuses
# to overwrite an existing generated config.
# Bucket names below are the intended names. R2 object layout per
# registry is the published site root (generations/, current marker
# object holding the generation id, shared blob dirs).

name = "stuff"
compatibility_date = "2026-10-30"
main = "src/entry.ts"

[build]
command = "npm run build:wasm"

[[r2_buckets]]
binding = "MYCRATES"
bucket_name = "stuff-mycrates"

[[r2_buckets]]
binding = "MYNPM"
bucket_name = "stuff-mynpm"

[[r2_buckets]]
binding = "PYPI"
bucket_name = "stuff-mypypi"

[vars]
STUFF_ROUTES = '[{"host":"crates.17166969.xyz","bucket_binding":"MYCRATES","key_prefix":""},{"host":"npm.17166969.xyz","bucket_binding":"MYNPM","key_prefix":""},{"host":"pypi.17166969.xyz","bucket_binding":"PYPI","key_prefix":""}]'
STUFF_UNIFIED_HOST = "stuff.17166969.xyz"

[[routes]]
pattern = "crates.17166969.xyz"
custom_domain = true

[[routes]]
pattern = "npm.17166969.xyz"
custom_domain = true

[[routes]]
pattern = "pypi.17166969.xyz"
custom_domain = true

[[routes]]
pattern = "stuff.17166969.xyz"
custom_domain = true

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 0.25

[observability.traces]
enabled = true
head_sampling_rate = 0.10
