# stuff worker deployment (Cloudflare).
# Owner flow: cf deploy (builds via worker-build, provisions R2 with
# --provision on first deploy). Do not edit cloudflare.config.ts or
# wrangler.config.ts by hand; change wrangler.toml and re-run cf migrate.
# Bucket names below are the intended names. R2 object layout per
# registry is the published site root (generations/, current marker
# object holding the generation id, shared blob dirs).

name = "stuff"
compatibility_date = "2026-10-30"
main = "build/worker/shim.mjs"

[build]
command = "cargo install -q worker-build && worker-build --release"

[[r2_buckets]]
binding = "MYCRATES"
bucket_name = "stuff-mycrates"

[[r2_buckets]]
binding = "MYNPM"
bucket_name = "stuff-mynpm"

[[r2_buckets]]
binding = "PYPI"
bucket_name = "stuff-mypypi"

[vars]
STUFF_ROUTES = '[{"url_prefix":"mycrates","bucket_binding":"MYCRATES","key_prefix":""},{"url_prefix":"mirror","bucket_binding":"MYNPM","key_prefix":""},{"url_prefix":"pypi","bucket_binding":"PYPI","key_prefix":""}]'
