[package]
name = "stuff-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stuff-http = { version = "0.1.0", path = "../stuff-http" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = "0.8"
