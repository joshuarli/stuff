[package]
name = "stuff-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deser = { version = "0.10", features = ["derive"] }
deser-json = "0.10"
deser-value = "0.10"
stuff-catalog = { version = "0.1.0", path = "../stuff-catalog" }
stuff-http = { version = "0.1.0", path = "../stuff-http" }
stuff-store = { version = "0.1.0", path = "../stuff-store" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
