[package]
name = "mynpm"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "npm registry archive"
repository = "https://github.com/joshuarli/stuff"
autobins = false

[lib]
name = "mynpm"
path = "src/lib.rs"

[[bin]]
name = "mynpm"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
deser = { version = "0.10", features = ["derive"] }
deser-json = "0.10"
deser-value = "0.10"
deser-yaml = "0.10"
flate2 = { version = "1.0", features = ["miniz_oxide"] }
h12tiny-client-sync = { version = "0.6.0", path = "../h12tiny-client-sync", features = ["tls"] }
rustc-hash = "2.1.3"
rustix = { version = "1", features = ["fs"] }
sha1 = "0.11"
sha2 = "0.11"
tar = "0.4"
stuff-url = { version = "0.1.0", path = "../stuff-url" }
stuff-store = { version = "0.1.0", path = "../stuff-store" }
stuff-catalog = { version = "0.1.0", path = "../stuff-catalog" }

[dev-dependencies]
tempfile = "3.13"
