[package]
name = "stuff-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[[bin]]
name = "stuff-server"
path = "src/main.rs"

[dependencies]
httparse = "1"
stuff-http = { version = "0.1.0", path = "../stuff-http" }
stuff-store = { version = "0.1.0", path = "../stuff-store" }

[dev-dependencies]
flate2 = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3.13"
