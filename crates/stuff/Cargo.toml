[package]
name = "stuff"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Unified package catalog CLI for stuff registries"
repository = "https://github.com/joshuarli/stuff"
autobins = false

[lib]
name = "stuff"
path = "src/lib.rs"

[[bin]]
name = "stuff"
path = "src/main.rs"

[dependencies]
deser-json = "0.10"
deser-toml = "0.10"
deser-value = "0.10"
base64 = "0.23"
flate2 = { version = "1.0", features = ["miniz_oxide"] }
h12tiny-client-sync = { version = "0.6.0", path = "../h12tiny-client-sync", features = ["tls"] }
hmac = "0.13"
md-5 = "0.11"
myoci = { version = "0.1.0", path = "../myoci" }
mynpm = { version = "0.1.0", path = "../mynpm" }
mypypi = { version = "0.1.0", path = "../mypypi" }
quick-xml = { version = "0.42", default-features = false }
sha2 = "0.11"
stuff-cargo-shard = { version = "0.1.0", path = "../stuff-cargo-shard" }
stuff-catalog = { version = "0.1.0", path = "../stuff-catalog" }
stuff-oci = { version = "0.1.0", path = "../stuff-oci" }
stuff-store = { version = "0.1.0", path = "../stuff-store" }
stuff-url = { version = "0.1.0", path = "../stuff-url" }
tar = "0.4"

[dev-dependencies]
tempfile = "3.13"
